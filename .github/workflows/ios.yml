name: iOS unsigned IPA
on:
  workflow_dispatch: {}
jobs:
  build:
    runs-on: macos-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run build
        env: { VITE_RELAY_URL: "${{ vars.RELAY_URL }}" }
      - run: npx cap add ios && npx cap sync ios
      - name: Build unsigned IPA
        working-directory: app/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir Payload && cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr Mess-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: mess-ios-ipa, path: app/ios/App/Mess-unsigned.ipa }
